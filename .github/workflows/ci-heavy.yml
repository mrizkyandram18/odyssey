# Deferred heavy / infra CI — NOT blocking for MVP merges.
# Run manually: Actions → "CI Heavy (Deferred)" → Run workflow.
# Restored later when Postgres/E2E infra is stable.
# Backlog: docs/release/ci_mvp_backlog.md
name: CI Heavy (Deferred)

on:
  workflow_dispatch:
    inputs:
      run_race:
        description: "Run Go race detector"
        type: boolean
        default: true
      run_integration:
        description: "Run Playwright integration (needs working DB env)"
        type: boolean
        default: true
      run_docker:
        description: "Run Docker image build (no push)"
        type: boolean
        default: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  race:
    name: Race Detector
    if: ${{ inputs.run_race }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go Race Detector
        run: CGO_ENABLED=1 go test -race ./...

  integration:
    name: Integration (Playwright)
    if: ${{ inputs.run_integration }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: odyssey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright browsers
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright Tests
        working-directory: web
        env:
          SUPABASE_URL: http://localhost:5432
          SUPABASE_SERVICE_KEY: dummy_key
          PARENT_ID: dummy_parent
          SESSION_SIGNING_SECRET: dummy_secret
          # NOTE: still needs a real backend + seed path before this is reliable.
          # Deferred for MVP; do not treat failures here as merge blockers.
        run: |
          npm run test:e2e
      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  docker-build:
    name: Docker Build
    if: ${{ inputs.run_docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true

  release:
    name: Check Release
    needs: [race, integration, docker-build]
    # Run even if optional jobs were skipped via inputs
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize heavy CI
        run: |
          echo "Heavy CI finished (manual). This job is deferred from MVP merge gate."
          echo "race=${{ needs.race.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "docker=${{ needs.docker-build.result }}"
