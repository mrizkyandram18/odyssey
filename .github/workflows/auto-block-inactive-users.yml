name: Auto-block inactive users

on:
  schedule:
    - cron: '5 17 * * *'
  workflow_dispatch:

concurrency:
  group: auto-block-inactive-users
  cancel-in-progress: false

jobs:
  auto-block:
    name: Trigger cycle-aware auto-block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call auto-block endpoint
        run: |
          set -euo pipefail
          BASE_URL="${{ secrets.ODYSSEY_PRODUCTION_URL }}"
          TOKEN="${{ secrets.ODYSSEY_AUTO_BLOCK_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.ODYSSEY_INTERNAL_METRICS_TOKEN }}"
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::ODYSSEY_PRODUCTION_URL secret is not set"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::ODYSSEY_AUTO_BLOCK_TOKEN (or ODYSSEY_INTERNAL_METRICS_TOKEN fallback) secret is not set"
            exit 1
          fi
          # Normalize URL (remove trailing slash)
          URL="${BASE_URL%/}/api/admin/members/auto-block"
          echo "Triggering auto-block at $URL"
          # POST with internal token; fail on non-2xx, timeout 30s, retry once
          HTTP_CODE=$(curl -s -o /tmp/auto_block_resp.json -w "%{http_code}" \
            --max-time 30 \
            --retry 2 --retry-delay 5 \
            -X POST "$URL" \
            -H "X-Auto-Block-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' || true)
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/auto_block_resp.json || true
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Auto-block endpoint returned non-2xx status $HTTP_CODE"
            exit 1
          fi
          # Validate response contains success
          if ! grep -q '"success"' /tmp/auto_block_resp.json; then
            echo "::error::Response does not contain success field"
            cat /tmp/auto_block_resp.json
            exit 1
          fi
          echo "Auto-block completed successfully"
        shell: bash
