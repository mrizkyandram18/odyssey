# MVP minimal CI — blocking path for push/PR.
# Heavy / flaky jobs live in ci-heavy.yml (workflow_dispatch only).
# See docs/release/ci_mvp_backlog.md for deferred checks.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Go format and vet
        run: |
          go fmt ./...
          if [ "$(go fmt ./... 2>&1)" != "" ]; then
            echo "Code is not formatted. Run 'go fmt ./...' and commit."
            exit 1
          fi
          go vet ./...
      - name: Frontend type check and lint
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Go Unit Tests
        run: go test -v -count=1 ./...
      - name: Frontend Vitest
        working-directory: web
        run: |
          npm ci
          npm run test

  build:
    name: Build Artifacts
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build backend binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X odyssey/pkg/observability.Version=ci" \
            -o /tmp/odyssey ./internal/api/dev
      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-backend
          path: /tmp/odyssey

      - name: Build frontend dist
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-frontend
          path: web/dist/
