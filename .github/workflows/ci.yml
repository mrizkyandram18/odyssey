name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Go format and vet
        run: |
          go fmt ./...
          if [ "$(go fmt ./... 2>&1)" != "" ]; then
            echo "Code is not formatted. Run 'go fmt ./...' and commit."
            exit 1
          fi
          go vet ./...
      - name: Frontend type check and lint
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Go Unit Tests
        run: go test -v -count=1 ./...
      - name: Frontend Vitest
        working-directory: web
        run: |
          npm ci
          npm run test

  race:
    name: Race Detector
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go Race Detector
        run: CGO_ENABLED=1 go test -race ./...

  integration:
    name: Integration (Playwright)
    needs: race
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: odyssey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright browsers
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright Tests
        working-directory: web
        env:
          SUPABASE_URL: http://localhost:5432
          SUPABASE_SERVICE_KEY: dummy_key
          PARENT_ID: dummy_parent
          SESSION_SIGNING_SECRET: dummy_secret
          # You would normally start backend here. For demonstration, we just run the tests:
        run: |
          # Start backend in background (requires wait-on or similar in real CI)
          # go run ../api/dev/main.go & 
          npm run test:e2e
      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  build:
    name: Build Artifacts
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      
      - name: Build backend binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X odyssey/pkg/observability.Version=ci" \
            -o /tmp/odyssey ./api/dev
      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-backend
          path: /tmp/odyssey

      - name: Build frontend dist
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-frontend
          path: web/dist/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true

  release:
    name: Check Release
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check if release is needed
        run: echo "All CI checks passed. Ready for release review."
